{% extends "base.html" %}
{% block title %}Forbidden{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900/80">
  <div class="mb-4 text-6xl">⛔</div>
  <h1 class="text-2xl font-bold text-slate-900 dark:text-white">403 Forbidden</h1>
  <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">You do not have permission to access this page.</p>
  <a href="{{ url_for('index') }}" class="mt-6 inline-flex rounded-xl bg-primary-600 px-5 py-3 text-sm font-semibold text-white hover:bg-primary-500">Back to Dashboard</a>
</div>
{% endblock %}
